services:
  mysql:
    image: mysql:8.0
    container_name: finnhub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-admin_gym_db}
      MYSQL_USER: ${DATABASE_USERNAME:-gymuser}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finnhub_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-gymuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-rootpassword}
      DATABASE_NAME: ${DATABASE_NAME:-admin_gym_db}
      JWT_SECRET: ${JWT_SECRET:-my_jwt_secret}
      PORT: ${PORT:-3000}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

volumes:
  mysql_data:
